<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student List</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        table {
            background-color: yellow;
            border: 2px solid red;
            margin: 30px auto;
            border-collapse: collapse;
        }

        tr,
        th,
        td {
            border: 2px solid brown;
            font-size: 20px;
            padding: 5px 15px;
        }

        .heading {
            background-color: lightcoral;
            color: white;
            font-size: 25px;
            text-align: center;
        }

        th {
            background-color: lightblue;
        }

        tr:nth-child(2) th:not(:first-child) {
            background-color: lightgreen;
        }

        tr:nth-child(2) th:not(:first-child):hover {
            background-color: violet;
            color: white;
        }

        td:hover {
            background-color: blue;
            color: white;
        }
    </style>
</head>

<body>

    <table>

        <!-- Heading Box -->
        <tr>
            <th class="heading" colspan="5">STUDENT LIST</th>
        </tr>

        <tr>
            <th>Name</th>
            <th>nithu</th>
            <th>sathya</th>
            <th>divya</th>
            <th>abi</th>
        </tr>

        <tr>
            <th>Age</th>
            <td>22</td>
            <td>23</td>
            <td>30</td>
            <td>25</td>
        </tr>

        <tr>
            <th>Gender</th>
            <td>female</td>
            <td>female</td>
            <td>Female</td>
            <td>female</td>
        </tr>

    </table>

</body>

</html>
