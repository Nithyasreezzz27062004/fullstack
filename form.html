<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>On-Site Enquiries Form</title>

    <style>
        body {
            background: linear-gradient(#160665, #006b1b);
            color: white;
            padding: 10px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        form {
            width: 40%;
            margin: auto;
        }

        label {
            margin-top: 10px;
            margin-bottom: 5px;
            display: block;
        }

        input {
              width: 70%;
              height: 30px;
              border: none;
              border-radius: 20px;
              padding-left: 15px;
        }

        button {
             background-color: orange;
            margin-top: 30px;
            width: 70%;
            height: 30px;
            border-radius: 20px;
             border: none;
            
        }
        img{
            width:100px;
            margin:auto;
            display:block
        }
    </style>
</head>

<body>
    <img src="./logo.png" alt="logo">

    <h1>On-Site Enquiries Form</h1>

    <form>
        <label>Name *</label><input type="text">
        <label>Where are you *</label><input type="text">
        <label>Street Address</label><input type="text">
        <label>Address Line 2</label><input type="text">
        <label>City</label><input type="text">
       <button type="submit">SUBMIT</button>
     </form>
</div>
</body>

</html>
