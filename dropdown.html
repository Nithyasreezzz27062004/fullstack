<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0px;
            padding: 0px;   
            box-sizing: border-box;
        }

        .dropdown{
            background-color: rgb(0, 255, 47);
            width:150px;
            height:auto;
            margin:100px auto;
        }
        button{
            width:100%;
            padding:8px 10px;
            font-size: 18px;
            border: none;
        }
        
        .dropdowncon{
        list-style-type: none;
        text-align: center;
        display: none;
        }

        .dropdowncon > li{
            border-bottom: 2px solid black;
            /* padding:5px 10px;             */
        }
        .link{
            text-decoration: none;
            font-size: 20px;
            display:inline-block;
            width:100%;
            height: 100%;
            padding: 5px 10px;
            
        }

        #dropdown:hover #dropdowncon{
                 display: block;
        }
        .link:hover{
             background-color: black;
             color:white;
        }
       
    </style>
</head>
<body>
    <div class="dropdown" id = "dropdown">
         <button>Menu</button>
         <ul class="dropdowncon" id = "dropdowncon">
               <li><a href="" class="link">HOme</a></li>
               <li><a href="" class="link">Contact</a></li>
               <li><a href="" class="link">Services</a></li>
               <li><a href="" class="link">Product</a></li>
               <li><a href="" class="link">Portfolio</a></li>
         </ul>
    </div>
     
</body>
</html>
