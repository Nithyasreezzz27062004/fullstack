<!DOCTYPE html>
<html lang="en">

<head>
</head>

<body>

    <h1>Javascript</h1>

    <div class="con" id="con">

    </div>

    <script>

        const arr = ["red", "green", "blue", "yellow"]

        tag = ""

        for (let i = 0; i < arr.length; ++i) {

            li = `<li style="color:${arr[i]};">${arr[i]}</li>`;
            tag += li

        }

        document.getElementById("con").innerHTML = "<ul>" + tag + "</ul>";

    </script>

</body>

</html>
