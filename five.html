<!DOCTYPE html>  
<html lang="en">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Document</title>  
    <style>  
        *{  
            margin:0px;  
            padding:0px;  
            box-sizing: border-box;  
        }  
        form{  
            background-color: lightpink;  
            width:400px;  
            margin:50px auto;  
            padding:30px;  
        }  
        #firstBox{  
            background-color: violet;  
        }  
        .fs{  
            font-size: 25px;  
        }  
    </style>  
</head>  
<body>  
     <form method="GET" action="./flower.jpg" enctype="multipart/form-data">  
        <label for="">Name : </label>  
        <input type="text" name="name" placeholder="nithu" id="firstBox" class="fs"><br> 
 
        <label for="">Age : </label>  
        <input type="number" name="age" placeholder="22" step="3" min="18" max="50"><br> 
 
        <label for="">Email : </label>  
        <input type="email" name="email"><br> 
 
        <label for="">Aadhaar : </label>  
        <input type="text" name="adhaar" placeholder="7564 4553 0997" required><br> 
 
        <label for="">Gender</label>  
        <input type="radio" name="gender" value="male">  
        <label for="">Male</label> 
 
        <input type="radio" name="gender" value="female">  
        <label for="">FeMale</label> 
 
        <input type="radio" name="gender" value="other">  
        <label for="">Other</label><br> 
 
        <label for="">Course : </label><br> 
 
        <label for="">Python</label>  
        <input type="checkbox" name="c1" id="" value="Python"><br> 
 
        <label for="">Java</label>  
        <input type="checkbox" name="c2" id="" value="java"><br> 
 
        <label for="">C++</label>  
        <input type="checkbox" name="c3" id="" value="c++"><br> 
 
        <input type="color">  
        <input type="submit">          
     </form>  
</body>  
</html>
