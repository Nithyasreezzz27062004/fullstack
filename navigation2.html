
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer">

    <title>EduPro</title>


    <style>

        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        nav {
            width: 100%;
            height: 10vh;
            background-color: aqua;
            display: flex;
        }


        .edu-pro {
            width: 250px;
            height: 100%;
            background-color: green;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        .edu-pro img {
            width: 50px;
            height: 50px;
        }


        .edu-pro span {
            font-size: 30px;
            font-weight: 600;
            margin-left: 15px;
            font-family: sans-serif;
        }

        .ul {
            background-color: red;
            width: 600px;
            height: 100%;

            padding: 5px;

            display: flex;
            align-items: center;
        }


        .ul > li {
            list-style-type: none;
            padding: 15px 20px;
        }


        .link {
            text-decoration: none;
            color: black;
        }

        .request-btn {
            width: 300px;
            height: 100%;

            background-color: yellow;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-left: auto;
        }


        .request-btn > i {
            width: 50px;
            height: 50px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 23px;
            color: black;
        }


        .request-btn > button {
            background-color: #0168f9;

            font-size: 20px;

            padding: 13px 25px;

            border: none;

            color: whitesmoke;

            border-radius: 15px;

            margin-left: 10px;
        }

        .menu-bar {
            display: none;
        }

        .hero-section {
            width: 100%;

            display: flex;

            background-color: #f1f7fd;
        }


        .con {
            width: 50%;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: flex-start;

            gap: 20px;

            padding: 50px;
        }


        .sub-heading {
            color: #006bff;

            font-size: 15px;

            letter-spacing: 1px;
        }


        .heading {
            font-size: 47px;

            font-weight: 700;

            line-height: 1.1;
        }


        .description {
            font-size: 18px;

            line-height: 1.4;
        }


        .btn-group button {
            background-color: #006bff;

            color: white;

            font-size: 18px;

            padding: 12px 20px;

            border-radius: 10px;

            border: 1px solid #006bff;

            margin-right: 10px;
        }


        .btn-group .button2 {
            background-color: white;

            color: #006bff;
        }


        .con-img {
            width: 50%;

            display: flex;

            justify-content: center;
            align-items: center;
        }


        .con-img img {
            width: 100%;

            height: auto;

            display: block;
        }


        @media (max-width: 768px) {


            nav {
                width: 100%;

                height: 70px;

                display: flex;

                align-items: center;

                position: relative;
            }


            .edu-pro {
                width: auto;

                height: 100%;

                padding-left: 15px;
            }


            .edu-pro img {
                width: 40px;

                height: 40px;
            }


            .edu-pro span {
                font-size: 24px;
            }



            .menu-bar {
                display: flex;

                margin-left: auto;

                width: 60px;

                height: 100%;

                justify-content: center;

                align-items: center;

                font-size: 25px;

                background-color: green;

                cursor: pointer;
            }



            .request-btn {
                display: none;
            }

            .ul {

                position: absolute;

                top: 70px;

                left: 0px;

                width: 100%;

                height: 0px;

                background-color: red;

                display: flex;

                flex-direction: column;

                align-items: center;

                justify-content: center;

                padding: 0px;

                overflow: hidden;

                transition: height 2s ease;

                z-index: 10;
            }

            .ul.show {

                height: 300px;
            }

            .ul > li {

                list-style-type: none;

                padding: 12px 20px;
            }


            .link {

                color: black;

                text-decoration: none;

                font-size: 18px;
            }

            .hero-section {

                flex-direction: column;
            }


            .con {

                width: 100%;

                padding: 30px 20px;

                align-items: center;

                text-align: center;
            }


            .sub-heading {

                font-size: 14px;
            }


            .heading {

                font-size: 32px;
            }


            .description {

                font-size: 16px;
            }


            .btn-group {

                display: flex;

                flex-wrap: wrap;

                justify-content: center;

                gap: 10px;
            }


            .btn-group button {

                margin-right: 0px;
            }


            .con-img {

                width: 100%;
            }


            .con-img img {

                width: 100%;

                height: auto;
            }

        }

    </style>

</head>


<body>

    <nav>

        <div class="edu-pro">

            <img
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSzKoMwJAW8qg_mm7-k0gNwcWManSEtdmXa_W44_e5ctg&s=10"
                alt="EduPro">

            <span>EduPro</span>

        </div>

        <div class="menu-bar" onclick="menu()">

            <i class="fa-solid fa-bars"></i>

        </div>

        <ul class="ul">

            <li>
                <a href="" class="link">
                    Home
                </a>
            </li>


            <li>
                <a href="" class="link">
                    About
                </a>
            </li>


            <li>
                <a href="" class="link">
                    Course
                </a>
            </li>


            <li>
                <a href="" class="link">
                    Blog
                </a>
            </li>


            <li>
                <a href="" class="link">
                    Contact
                </a>
            </li>

        </ul>



        <div class="request-btn">

            <i class="fa-solid fa-magnifying-glass"></i>

            <button>
                Get Started
            </button>

        </div>


    </nav>



    <section class="hero-section">


        <div class="con">

            <h3 class="sub-heading">
                LEARN ANYTHING, ANYWHERE
            </h3>


            <h1 class="heading">
                Build Your Future With Better Learning
            </h1>


            <p class="description">
                Join thousands of students and learn new skills with our expert instructors.
            </p>


            <div class="btn-group">

                <button>
                    Explore Courses
                </button>


                <button class="button2">
                    Watch Video
                </button>

            </div>

        </div>

        <div class="con-img">

            <img
                src="./girl.png"
                alt="Student">

        </div>


    </section>

    <script>

        let toggled = false;

        function toggle() {

            if (!toggled) {

                document.getElementById("ul").style.left = "";

                toggled = true;

                return;
            }

            if (toggled) {

                document.getElementById("ul").style.left = "";

                toggled = true;

                return;
            }
        }


    </script>


</body>

</html>
